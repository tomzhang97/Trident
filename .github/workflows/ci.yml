name: CI

on:
  push:
  pull_request:

jobs:
  framework-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [pareto, safe_cover]
    defaults:
      run:
        working-directory: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
